services:
  paperforge:
    build: .
    environment:
      - GEMINI_API_KEY
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - GROQ_API_KEY
      - OPENROUTER_API_KEY
      - DEEPSEEK_API_KEY
      - MISTRAL_API_KEY
      - OLLAMA_API_KEY
      - LLM_API_KEY
      - PAPERFORGE_CONTACT_EMAIL
      - OPENALEX_API_KEY
    volumes:
      - ./projects:/projects
    working_dir: /projects
    command: ["--help"]
