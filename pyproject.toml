[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "paperforge-agent"
version = "0.2.1"
description = "Evidence-first, provider-neutral research paper workflow agent"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "filelock>=3.15,<4",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
documents = [
  "pymupdf>=1.24,<2",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
paperforge = "paperforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/paperforge"]

[tool.hatch.build.targets.wheel.force-include]
"config/default.yaml" = "paperforge/default.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "B008", # Typer's documented declarative parameter pattern.
  "E501", # Ruff formatter intentionally leaves some strings unsplit.
]
