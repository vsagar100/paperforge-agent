[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "paperforge-agent"
version = "3.0.0"
description = "Resumable evidence-first manuscript workflows with configurable model routing"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["filelock>=3.15,<4", "httpx[socks]>=0.27,<1", "pydantic>=2.8,<3", "python-dotenv>=1,<2", "PyYAML>=6,<7", "typer>=0.12,<1"]

[project.optional-dependencies]
documents = ["pymupdf>=1.24,<2", "python-docx>=1.1,<2", "openpyxl>=3.1,<4", "python-pptx>=1,<2", "Pillow>=10,<13", "defusedxml>=0.7,<1"]
scientific = ["numpy>=1.26,<3", "scipy>=1.12,<2", "h5py>=3.10,<4"]
dev = ["pytest>=8.2,<10", "pytest-cov>=5,<7", "ruff>=0.6,<1", "build>=1.2,<2"]

[project.scripts]
paperforge = "paperforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/paperforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
